[workspace]
channels = ["conda-forge"]
name = "turbo-mojo"
# glibc 2.34 or newer: libghostty-vt (the terminal emulator library) is built for it
platforms = [
  { name = "linux-aarch64-glibc", platform = "linux-aarch64", glibc = "2.34" },
  { name = "linux-64-glibc", platform = "linux-64", glibc = "2.34" },
  # macOS on Apple silicon: resolved and compiled for here (scripts/macos-link.sh); not run
  "osx-arm64",
]
version = "2.4.0"          # (the same as src/version.mojo)

# The default environment uses the stable Mojo release. The `nightly` environment is a
# canary: `pixi run canary` runs the whole gate against the newest nightly toolchain so
# that upcoming language or library changes are noticed early.
[feature.stable]
channels = ["https://conda.modular.com/max"]

[feature.stable.dependencies]
mojo = ">=1.2,<2"

[feature.nightly]
channels = ["https://conda.modular.com/max-nightly"]

[feature.nightly.dependencies]
mojo = ">=1.2.0.dev2026092905"

[environments]
default = ["stable"]
nightly = ["nightly"]

[tasks]
build = "mkdir -p build && mojo build -D \"TURBOMOJO_MOJO=$(mojo --version)\" -I src src/main.mojo -o build/tmide -Xlinker $CONDA_PREFIX/lib/libghostty-vt.a"
run = { cmd = "./build/tmide", depends-on = ["build"] }
check = "scripts/check.sh"
# a tar file to copy to a server: tmide and the libraries it loads (scripts/bundle.sh)
bundle = { cmd = "scripts/bundle.sh", depends-on = ["build"] }
# macOS (osx-arm64): compile and link here; it cannot be run here (scripts/macos-link.sh)
macos-link = "scripts/macos-link.sh"
canary = "TM_ENV=nightly scripts/check.sh"
# the conda package (recipe/recipe.yaml) into build/conda
package = "pixi exec rattler-build build --recipe recipe/ -c https://conda.modular.com/max -c conda-forge --output-dir build/conda"

[dependencies]
libghostty-vt = ">=1.0.0,<2"
# a language server for Python (`ruff server`): what tests/test_lsp_extra.mojo checks the
# configurable language servers with, and one to use for Python files
ruff = ">=0.5"
