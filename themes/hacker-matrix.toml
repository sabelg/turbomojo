# Hacker Matrix: green phosphor on black, like an old CRT, with red, amber and blue
# for what needs to stand out (errors, warnings and strings, types and notes).
name = "Hacker Matrix"
base = "amber"
dark = true

[colors]
desk_fg = "#0B2E13"
desk_bg = "#000000"
menu_fg = "#00D838"
menu_bg = "#031A08"
menu_hot = "#FFB000"
menu_sel_fg = "#000000"
menu_sel_bg = "#00FF41"
menu_dis = "#1E8C3A"
status_fg = "#00D838"
status_bg = "#031A08"
status_hot = "#FFB000"
ed_fg = "#00D838"
ed_bg = "#020A04"
frame_act = "#00FF41"
