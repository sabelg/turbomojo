# Hacker Matrix: green phosphor like an old CRT, with four bright accents in the same
# style: blue (types, built-ins, notes), yellow (definitions, numbers, warnings), red
# (errors, decorators, self) and brown (strings). No scanlines of its own: set
# scanlines = true here (or under [ui]) for them, or use a terminal's CRT shader.
name = "Hacker Matrix"
base = "amber"
dark = true
scanlines = false

[colors]
desk_fg = "#0B2E13"
desk_bg = "#000000"
menu_fg = "#00D838"
menu_bg = "#031A08"
menu_hot = "#FFE45C"
menu_sel_fg = "#000000"
menu_sel_bg = "#00FF41"
menu_dis = "#1E8C3A"
status_fg = "#00D838"
status_bg = "#031A08"
status_hot = "#FFE45C"
ed_fg = "#00D838"
ed_bg = "#031A08"
frame_act = "#00FF41"
frame_inact = "#1E8C3A"
title_fg = "#00FF41"
sel_fg = "#000000"
sel_bg = "#00B32C"
curline_bg = "#06230C"
gutter_fg = "#47AA5E"
gutter_bg = "#031A08"
bracket_fg = "#000000"
bracket_bg = "#FFE45C"
match_fg = "#000000"
match_bg = "#3FA9F5"
doc_fg = "#00D838"
doc_bg = "#031A08"
doc_bold = "#00FF41"
doc_code = "#FFE45C"
doc_dim = "#47AA5E"
diag_err = "#FF6054"
diag_warn = "#FFE45C"
diag_note = "#3FA9F5"
ruler_bg = "#05220C"
word_bg = "#0A2A12"
icon_fg = "#00FF41"
scroll_fg = "#00B32C"
scroll_bg = "#041409"
msg_fg = "#00D838"
msg_bg = "#031A08"
msg_err = "#FF6054"
msg_warn = "#FFE45C"
msg_note = "#3FA9F5"
msg_ok = "#00FF41"
git_add = "#00FF41"
git_mod = "#3FA9F5"
git_del = "#FF6054"
msg_sel_fg = "#000000"
msg_sel_bg = "#00FF41"
msg_frame = "#00FF41"
dlg_fg = "#00D838"
dlg_bg = "#031A08"
dlg_frame = "#00FF41"
dlg_title = "#00FF41"
dlg_hot = "#FFE45C"
in_fg = "#00FF41"
in_bg = "#000000"
btn_fg = "#00D838"
btn_bg = "#0E4D1F"
btn_focus_fg = "#FFE45C"
btn_hot = "#3FA9F5"
btn_shadow = "#000000"
list_fg = "#00D838"
list_bg = "#000000"
list_sel_fg = "#000000"
list_sel_bg = "#00FF41"
shadow_fg = "#0B2E13"
shadow_bg = "#000000"

[syntax]
text = "#00D838"
keyword = "#00FF41"
type = "#3FA9F5"
comment = "#3E9E4E"
string = "#D2964A"
number = "#FFE45C"
decorator = "#FF6054"
symbol = "#47AA5E"
builtin = "#6CB8FF"
self = "#FF6B5B"
def = "#FFE45C"
param = "#B6FFB6"
property = "#00D838"
namespace = "#6CB8FF"
