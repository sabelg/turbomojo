# Terminal Mono: the terminal's default colours only, with black on white (palette 0 on
# 7) for what must stand out - the selection, the menu bar. TurboMojo uses it when
# NO_COLOR is set (https://no-color.org) and no theme is chosen in the config file.
# Problems are told apart by their letters (E W i) and underlines, not by colour.
name = "Terminal Mono"
base = "midnight"
dark = true
scanlines = false

[colors]
desk_fg = "default"
desk_bg = "default"
menu_fg = "ansi:0"
menu_bg = "ansi:7"
menu_hot = "ansi:0"
menu_sel_fg = "ansi:0"
menu_sel_bg = "ansi:7"
menu_dis = "default"
status_fg = "ansi:0"
status_bg = "ansi:7"
status_hot = "ansi:0"
ed_fg = "default"
ed_bg = "default"
frame_act = "default"
frame_inact = "default"
title_fg = "default"
sel_fg = "ansi:0"
sel_bg = "ansi:7"
curline_bg = "default"
gutter_fg = "default"
gutter_bg = "default"
bracket_fg = "ansi:0"
bracket_bg = "ansi:7"
match_fg = "ansi:0"
match_bg = "ansi:7"
doc_fg = "default"
doc_bg = "default"
doc_bold = "default"
doc_code = "default"
doc_dim = "default"
diag_err = "default"
diag_warn = "default"
diag_note = "default"
ruler_bg = "default"
word_bg = "default"
icon_fg = "default"
scroll_fg = "default"
scroll_bg = "default"
msg_fg = "default"
msg_bg = "default"
msg_err = "default"
msg_warn = "default"
msg_note = "default"
msg_ok = "default"
git_add = "default"
git_mod = "default"
git_del = "default"
msg_sel_fg = "ansi:0"
msg_sel_bg = "ansi:7"
msg_frame = "default"
dlg_fg = "default"
dlg_bg = "default"
dlg_frame = "default"
dlg_title = "default"
dlg_hot = "default"
in_fg = "default"
in_bg = "default"
btn_fg = "ansi:0"
btn_bg = "ansi:7"
btn_focus_fg = "ansi:0"
btn_hot = "ansi:0"
btn_shadow = "default"
list_fg = "default"
list_bg = "default"
