# Terminal ANSI: only your terminal's own 16 colours and its default foreground and
# background, so its colour scheme, its high-contrast and minimum-contrast settings
# decide how TurboMojo looks. Colours here are "ansi:0" to "ansi:15" or "default".
name = "Terminal ANSI"
base = "midnight"
dark = true
scanlines = false

[colors]
desk_fg = "ansi:8"
desk_bg = "default"
menu_fg = "ansi:0"
menu_bg = "ansi:7"
menu_hot = "ansi:4"
menu_sel_fg = "ansi:15"
menu_sel_bg = "ansi:4"
menu_dis = "ansi:8"
status_fg = "ansi:0"
status_bg = "ansi:7"
status_hot = "ansi:4"
ed_fg = "default"
ed_bg = "default"
frame_act = "ansi:14"
frame_inact = "ansi:8"
title_fg = "ansi:15"
sel_fg = "ansi:15"
sel_bg = "ansi:4"
curline_bg = "default"
gutter_fg = "ansi:8"
gutter_bg = "default"
bracket_fg = "ansi:0"
bracket_bg = "ansi:3"
match_fg = "ansi:0"
match_bg = "ansi:11"
doc_fg = "default"
doc_bg = "default"
doc_bold = "ansi:15"
doc_code = "ansi:6"
doc_dim = "ansi:8"
diag_err = "ansi:9"
diag_warn = "ansi:11"
diag_note = "ansi:12"
ruler_bg = "default"
word_bg = "default"
icon_fg = "ansi:14"
scroll_fg = "ansi:8"
scroll_bg = "default"
msg_fg = "default"
msg_bg = "default"
msg_err = "ansi:9"
msg_warn = "ansi:11"
msg_note = "ansi:12"
msg_ok = "ansi:10"
git_add = "ansi:10"
git_mod = "ansi:12"
git_del = "ansi:9"
msg_sel_fg = "ansi:15"
msg_sel_bg = "ansi:4"
msg_frame = "ansi:14"
dlg_fg = "default"
dlg_bg = "default"
dlg_frame = "ansi:14"
dlg_title = "ansi:15"
dlg_hot = "ansi:11"
in_fg = "default"
in_bg = "default"
btn_fg = "ansi:0"
btn_bg = "ansi:7"
btn_focus_fg = "ansi:4"
btn_hot = "ansi:4"
btn_shadow = "ansi:8"
list_fg = "default"
list_bg = "default"
list_sel_fg = "ansi:15"
list_sel_bg = "ansi:4"
shadow_fg = "ansi:8"
shadow_bg = "default"

[syntax]
text = "default"
keyword = "ansi:13"
type = "ansi:6"
comment = "ansi:8"
string = "ansi:2"
number = "ansi:3"
decorator = "ansi:5"
symbol = "default"
builtin = "ansi:6"
self = "ansi:5"
def = "ansi:12"
param = "default"
property = "default"
namespace = "ansi:6"
