msg_sel_fg = "#FFFFFF"
msg_sel_bg = "#0060A0"
msg_frame = "#56B4E9"
dlg_fg = "#E6E6E6"
dlg_bg = "#1C232B"
dlg_frame = "#56B4E9"
dlg_title = "#FFFFFF"
dlg_hot = "#F0E442"
