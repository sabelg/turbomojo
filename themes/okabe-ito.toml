[syntax]
text = "#E6E6E6"
keyword = "#56B4E9"
type = "#F0E442"
comment = "#76808A"
string = "#3CC79A"
number = "#E69F00"
decorator = "#E69F00"
symbol = "#C8CDD2"
builtin = "#56B4E9"
self = "#E192C0"
def = "#E192C0"
param = "#E6E6E6"
property = "#E6E6E6"
namespace = "#F0E442"

# Designed for terminals with 256 or 16 colours (else the nearest colour is used):
[colors16]
sel_bg = "ansi:4"
msg_sel_bg = "ansi:4"

[syntax16]
number = "ansi:11"
decorator = "ansi:11"
