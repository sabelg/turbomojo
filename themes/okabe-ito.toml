# Okabe-Ito: a dark theme for colour-blind eyes, from the eight colours of Okabe and
# Ito's "Color Universal Design" (2002/2008), lightened where needed to reach the
# contrast floors on the dark background. Errors are vermillion, warnings yellow,
# notes sky blue, success bluish green; git additions are sky blue, changes orange,
# deletions vermillion. The tests simulate protanopia, deuteranopia and tritanopia
# (Machado, Oliveira and Fernandes 2009) and check that these stay apart.
name = "Okabe-Ito"
base = "midnight"
dark = true
scanlines = false

[colors]
desk_fg = "#1C232B"
desk_bg = "#0B0E11"
menu_fg = "#E6E6E6"
menu_bg = "#1C232B"
menu_hot = "#F0E442"
menu_sel_fg = "#000000"
menu_sel_bg = "#56B4E9"
