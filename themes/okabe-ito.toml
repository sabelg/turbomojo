status_fg = "#E6E6E6"
status_bg = "#1C232B"
status_hot = "#F0E442"
ed_fg = "#E6E6E6"
ed_bg = "#101418"
frame_act = "#56B4E9"
frame_inact = "#56616C"
title_fg = "#FFFFFF"
sel_fg = "#FFFFFF"
sel_bg = "#0060A0"
curline_bg = "#171D23"
gutter_fg = "#7F8994"
gutter_bg = "#101418"
bracket_fg = "#000000"
bracket_bg = "#F0E442"
match_fg = "#000000"
match_bg = "#E69F00"
doc_fg = "#E6E6E6"
doc_bg = "#101418"
doc_bold = "#FFFFFF"
doc_code = "#56B4E9"
doc_dim = "#7F8994"
diag_err = "#F07A45"
diag_warn = "#F0E442"
diag_note = "#56B4E9"
ruler_bg = "#151A1F"
word_bg = "#1E2830"
icon_fg = "#56B4E9"
scroll_fg = "#7F8994"
scroll_bg = "#171D23"
msg_fg = "#E6E6E6"
msg_bg = "#101418"
