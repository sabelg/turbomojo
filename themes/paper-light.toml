# Paper Light: a light theme for terminals with a light background.
# Copy this file to ~/.config/turbomojo/themes/ under another name to make your own.
# Errors raspberry, warnings ochre, success and additions blue: they stay apart with
# the common kinds of colour blindness (checked in the tests).
name = "Paper Light"
base = "midnight"
dark = false

[colors]
desk_fg = "#D8D8D0"
desk_bg = "#E8E8E2"
menu_fg = "#2B2B2B"
menu_bg = "#E0E0DA"
menu_hot = "#A74600"
menu_sel_fg = "#FFFFFF"
menu_sel_bg = "#3A6EA5"
menu_dis = "#8A8A84"
status_fg = "#2B2B2B"
status_bg = "#E0E0DA"
status_hot = "#A74600"
ed_fg = "#1F1F1F"
ed_bg = "#FBFBF8"
frame_act = "#3A6EA5"
frame_inact = "#A8A8A0"
title_fg = "#1F1F1F"
sel_fg = "#1F1F1F"
sel_bg = "#C9DDF2"
curline_bg = "#F1F1EC"
gutter_fg = "#8A8A84"
gutter_bg = "#FBFBF8"
bracket_fg = "#1F1F1F"
bracket_bg = "#E2D6A8"
match_fg = "#1F1F1F"
match_bg = "#F4E3A1"
doc_fg = "#1F1F1F"
doc_bg = "#F3F3EE"
doc_bold = "#000000"
doc_code = "#7A3E9D"
doc_dim = "#6E6E68"
diag_err = "#C00060"
diag_warn = "#906000"
diag_note = "#2E6DB4"
ruler_bg = "#F0F0EA"
word_bg = "#E8EEF5"
icon_fg = "#3A6EA5"
scroll_fg = "#8A8A84"
scroll_bg = "#ECECE6"
msg_fg = "#1F1F1F"
msg_bg = "#F3F3EE"
msg_err = "#C00060"
msg_warn = "#906000"
msg_note = "#2E6DB4"
msg_ok = "#0070E0"
git_add = "#0070E0"
git_mod = "#906000"
git_del = "#C00060"
msg_sel_fg = "#FFFFFF"
msg_sel_bg = "#3A6EA5"
msg_frame = "#3A6EA5"
dlg_fg = "#1F1F1F"
dlg_bg = "#ECECE6"
dlg_frame = "#3A6EA5"
dlg_title = "#1F1F1F"
dlg_hot = "#A74600"
in_fg = "#1F1F1F"
in_bg = "#FFFFFF"
btn_fg = "#1F1F1F"
btn_bg = "#D6D6CF"
btn_focus_fg = "#1A4F8A"
btn_hot = "#A74600"
btn_shadow = "#B8B8B0"
list_fg = "#1F1F1F"
list_bg = "#FFFFFF"
list_sel_fg = "#FFFFFF"
list_sel_bg = "#3A6EA5"
shadow_fg = "#9A9A94"
shadow_bg = "#C8C8C0"

[syntax]
text = "#1F1F1F"
keyword = "#7A3E9D"
type = "#00708A"
comment = "#6E6E68"
string = "#508030"
number = "#A74600"
decorator = "#8A5700"
symbol = "#4A4A44"
builtin = "#00708A"
self = "#B03060"
def = "#1070E0"
param = "#5A4FA0"
property = "#355E8C"
namespace = "#00708A"

# Designed for terminals with 256 or 16 colours (else the nearest colour is used):
[colors256]
menu_hot = "256:124"

[colors16]
cursor = "ansi:4"
gutter_fg = "ansi:8"

[syntax16]
type = "ansi:4"
builtin = "ansi:4"
namespace = "ansi:4"
def = "ansi:12"
self = "ansi:1"

[syntax256]
string = "256:28"
