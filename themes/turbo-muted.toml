# Turbo Muted: Turbo Classic's places and parts - blue editor, grey bars and dialogs,
# cyan lists, green highlight - in low-saturation colours, for long sessions: navy
# for the CGA blue, cream for its yellow, muted teal, green and warm grey.
name = "Turbo Muted"
base = "classic"
dark = true
scanlines = false

[colors]
desk_fg = "#4A5680"
desk_bg = "#8E8A80"
menu_fg = "#000000"
menu_bg = "#B4B0A6"
menu_hot = "#7A2424"
menu_sel_fg = "#000000"
menu_sel_bg = "#7FA37A"
menu_dis = "#6A675F"
status_fg = "#000000"
status_bg = "#B4B0A6"
status_hot = "#7A2424"
ed_fg = "#E8E0A8"
ed_bg = "#26335C"
frame_act = "#E8E8E0"
frame_inact = "#8A8A84"
title_fg = "#F4F4EC"
sel_fg = "#000000"
sel_bg = "#7FA8A8"
curline_bg = "#2F3E6C"
gutter_fg = "#8CB4B4"
gutter_bg = "#212C50"
bracket_fg = "#FFFFFF"
bracket_bg = "#7A4A7A"
match_fg = "#000000"
match_bg = "#C08A50"
doc_fg = "#000000"
doc_bg = "#7FA8A8"
doc_bold = "#FFFFFF"
doc_code = "#1A2A6A"
doc_dim = "#2A3A4A"
diag_err = "#F09090"
diag_warn = "#E8C070"
diag_note = "#8CC8D8"
ruler_bg = "#2A3760"
word_bg = "#3A4A78"
icon_fg = "#9CC79A"
scroll_fg = "#26335C"
scroll_bg = "#7FA8A8"
msg_fg = "#000000"
msg_bg = "#7FA8A8"
msg_err = "#440000"
msg_warn = "#220033"
msg_note = "#1A2A6A"
msg_ok = "#00305A"
git_add = "#8CC8D8"
git_mod = "#E8D070"
git_del = "#E88080"
msg_sel_fg = "#000000"
msg_sel_bg = "#7FA37A"
msg_frame = "#E8E8E0"
dlg_fg = "#000000"
dlg_bg = "#B4B0A6"
dlg_frame = "#F4F4EC"
dlg_title = "#F4F4EC"
dlg_hot = "#7A2424"
in_fg = "#F4F4EC"
in_bg = "#26335C"
btn_fg = "#000000"
btn_bg = "#7FA37A"
btn_focus_fg = "#FFFFFF"
btn_hot = "#5A1414"
btn_shadow = "#1A1A18"
list_fg = "#000000"
list_bg = "#7FA8A8"
list_sel_fg = "#000000"
list_sel_bg = "#7FA37A"
shadow_fg = "#4A4A46"
shadow_bg = "#111111"

[syntax]
text = "#E8E0A8"
keyword = "#F4F4EC"
type = "#8CC8C0"
comment = "#A09E94"
string = "#E0B888"
number = "#D8A0D0"
decorator = "#9CC79A"
symbol = "#E8E0A8"
builtin = "#8CC0C0"
self = "#F4F4EC"
def = "#F4F4EC"
param = "#B4B2A8"
property = "#8CC0C0"
namespace = "#9CC79A"

# 16 colours cannot be muted: there it is Turbo Classic's look
[colors16]
ed_bg = "ansi:4"
gutter_bg = "ansi:4"
curline_bg = "ansi:4"
ruler_bg = "ansi:4"
word_bg = "ansi:4"
in_bg = "ansi:4"
scroll_fg = "ansi:4"
ed_fg = "ansi:11"
menu_hot = "ansi:4"
diag_err = "ansi:13"

[syntax16]
text = "ansi:11"
keyword = "ansi:15"
type = "ansi:10"
comment = "ansi:7"
string = "ansi:14"
number = "ansi:13"
decorator = "ansi:10"
symbol = "ansi:11"
builtin = "ansi:14"
self = "ansi:15"
