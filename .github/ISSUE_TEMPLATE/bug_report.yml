name: Problem report
description: Something does not work, or works wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Fastest: in TurboMojo, **Help > Report a problem...** writes this report for you
        (versions, terminal, last crash, settings without secrets) and copies it - paste
        it into the box below. Nothing is sent by the IDE.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what TurboMojo did, and what you expected.
    validations:
      required: true
  - type: textarea
    id: caps
    attributes:
      label: Output of `tmide --caps`
      description: Run it in the same terminal (and tmux, if you use it). It shows what the terminal can do and which Mojo was found.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `tmide --version`
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal, and tmux/SSH if used
      placeholder: kitty 0.39 on Linux, over SSH, inside tmux 3.4
  - type: textarea
    id: crash
    attributes:
      label: Last crash-log entry (if it crashed)
      description: The end of ~/.local/state/turbomojo/crash.log. Check it for anything private first.
      render: text
