# The conda package of TurboMojo, for rattler-build:
#   pixi exec rattler-build build --recipe recipe/ -c https://conda.modular.com/max -c conda-forge --output-dir build/conda
# then install it from that folder, for example:
#   pixi global install --channel ./build/conda --channel https://conda.modular.com/max --channel conda-forge turbomojo
context:
  version: "2.0.0"        # (the same as src/version.mojo; tests/test_release.mojo checks it)

package:
  name: turbomojo
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mkdir -p $PREFIX/bin $PREFIX/share/turbomojo
    - mojo build -I src src/main.mojo -o $PREFIX/bin/tmide -Xlinker $PREFIX/lib/libghostty-vt.a
    - cp -r examples $PREFIX/share/turbomojo/
    - cp docs/PLUGINS.md README.md $PREFIX/share/turbomojo/

requirements:
  build:
    - mojo >=1.2,<2
  host:
    - mojo-compiler >=1.2,<2
    - libghostty-vt >=1.0,<2        # linked in statically: not needed at run time
  run:
    # the Mojo runtime libraries the program is linked against (libKGENCompilerRTShared...)
    - ${{ pin_compatible('mojo-compiler', exact=True) }}
  ignore_run_exports:
    from_package:
      - libghostty-vt

tests:
  - script:
      - tmide --version
      - tmide --help

about:
  summary: A Turbo C++ style IDE for Mojo in the terminal, written in Mojo
  description: |
    TurboMojo is an editor and IDE for Mojo in the terminal: overlapping windows, a
    menu bar, the command palette, the Mojo language server, build and run, a
    debugger, integrated terminals, git, coding agents and plugins.
